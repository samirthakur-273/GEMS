name: gems_revamp
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 10.3.1+170

environment:
  sdk: ">=3.2.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  provider: ^6.0.5
  cupertino_icons: ^1.0.5
  geolocator: ^13.0.3
  geocoding: ^3.0.0
  google_maps_webservice: ^0.0.20-nullsafety.5
  intl: ^0.19.0
  url_launcher: ^6.1.11
  flutter_typeahead: ^4.6.2
  http: ^0.13.6
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.2
  flutter_html: ^3.0.0-beta.2
  cached_network_image: ^3.3.0
  location: ^5.0.3
  google_maps_flutter: ^2.3.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.9
  dotted_line: ^3.2.2
  barcode_widgets: ^2.0.0
  readmore: ^2.2.0
  carousel_slider: ^5.0.0
  page_view_indicators: ^2.0.0
  another_xlider: ^3.0.1
  string_validator: ^1.0.0
  email_validator: ^3.0.0
  pin_code_fields: ^8.0.1
  flutter_cupertino_datetime_picker: ^3.0.0
  fluttertoast: ^8.2.8
  dots_indicator: ^4.0.1
  smooth_page_indicator: ^1.1.0
  easy_debounce: ^2.0.3
  card_swiper: ^3.0.1
  shimmer: ^3.0.0
  share_plus: ^7.2.1
  firebase_core: ^3.4.0
  firebase_crashlytics: ^4.0.2
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^18.0.1
  smooth_star_rating_null_safety: ^1.0.4+2
  pattern_formatter: ^4.0.0
  external_app_launcher: ^4.0.3
  webview_flutter: ^4.7.0
  video_player:
  get: ^4.6.6
  barcode_widget: ^2.0.3
  app_links: ^6.3.0
  jailbreak_root_detection: ^1.1.6
  win32: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_keyboard_visibility: ^6.0.0

#   flutter_svg: ^1.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    - images/offermodule/
    - images/common/
    - images/homemodule/
    - images/giftcard/
    - images/purchase/
    - images/MyAccount/HelpandSupport/
    - images/purchase/
    - images/flight/
    - images/hotelmodule/
    - images/pointconversion/
    - images/MyAccount/
    - images/login/
    - images/payment/
    - images/eShop_icon/
    - images/advplus/
    - images/newlogo/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: fonts/Poppins/Poppins-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
